<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dopamine Forge 7.4 (Bulletproof Assets)</title>
    <style>
        :root {
            --bg: #050508;
            --surface: #12121a;
            --primary: #00e5ff;
            --danger: #ff0055;
            --text: #e0e0e0;
            --gold: #ffd700;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); overflow-x: hidden; }
        
        #app { max-width: 480px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; position: relative; }
        .screen { display: none; flex: 1; flex-direction: column; padding: 20px; animation: fadeIn 0.3s ease-in; position: relative; }
        .screen.active { display: flex; }
        
        .top-nav { width: 100%; display: flex; justify-content: flex-start; margin-bottom: 20px; }
        .btn-nav { background: transparent; border: 1px solid #333; color: #888; padding: 8px 15px; border-radius: 8px; font-size: 14px; cursor: pointer; text-transform: uppercase; font-weight: bold; transition: all 0.2s; }
        .btn-nav:active { background: #333; color: var(--text); }

        h1, h2, h3 { text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; text-align: center; }
        .neon-text { color: var(--primary); text-shadow: 0 0 10px rgba(0,229,255,0.5); }
        
        .btn { background: transparent; border: 2px solid var(--primary); color: var(--primary); padding: 18px; width: 100%; border-radius: 12px; font-size: 16px; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-bottom: 15px; transition: all 0.2s; box-shadow: 0 0 15px rgba(0,229,255,0.1); display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn:active { transform: scale(0.96); background: var(--primary); color: var(--bg); }
        .btn-danger { border-color: var(--danger); color: var(--danger); box-shadow: 0 0 15px rgba(255,0,85,0.1); }
        .btn-danger:active { background: var(--danger); color: var(--bg); }
        .btn-spin { background: linear-gradient(45deg, #00e5ff, #b100ff); border: none; color: white; box-shadow: 0 0 20px rgba(177,0,255,0.4); }
        
        /* ЖЕСТКАЯ ФИКСАЦИЯ АВАТАРА */
        .avatar-container { display: flex; flex-direction: column; align-items: center; margin: 10px 0 20px 0; position: relative; }
        
        .rpg-avatar-img { 
            display: block !important;
            width: 220px !important; 
            height: 220px !important; 
            min-width: 220px;
            min-height: 220px;
            border-radius: 50%; 
            object-fit: cover; 
            object-position: center;
            border: 4px solid #333;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.6)); 
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 2;
            background-color: transparent; 
            margin: 0 auto;
        }
        
        .hologram-base { position: absolute; bottom: -5px; width: 140px; height: 20px; background: radial-gradient(ellipse at center, var(--primary) 0%, transparent 70%); opacity: 0.5; border-radius: 50%; filter: blur(5px); z-index: 1; transition: all 0.5s; }
        
        /* Эффекты ауры для картинки в зависимости от уровня */
        .tier-1 .rpg-avatar-img { border-color: #555; filter: grayscale(50%); }
        .tier-2 .rpg-avatar-img { border-color: #00e5ff; box-shadow: 0 0 20px rgba(0,229,255,0.4); }
        .tier-3 .rpg-avatar-img { border-color: #00ffaa; box-shadow: 0 0 30px rgba(0,255,170,0.5); animation: float 3s infinite; }
        .tier-4 .rpg-avatar-img { border-color: #ffd700; box-shadow: 0 0 40px rgba(255,215,0,0.6), inset 0 0 20px rgba(255,215,0,0.3); animation: floatPulse 2s infinite; }
        
        .tier-dead .rpg-avatar-img { border-color: var(--danger); filter: grayscale(100%) sepia(100%) hue-rotate(300deg) contrast(150%); box-shadow: 0 0 30px rgba(255,0,85,0.8); animation: glitch 0.3s infinite; }
        .tier-dead .hologram-base { background: radial-gradient(ellipse at center, var(--danger) 0%, transparent 70%); }

        .speech-bubble { background: var(--surface); padding: 12px; border-radius: 12px; border-left: 4px solid var(--primary); margin-bottom: 15px; font-style: italic; width: 100%; text-align: center; font-size: 14px; min-height: 44px;}
        
        /* Stats & Progress */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--surface); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-value { font-size: 28px; font-weight: 900; color: var(--primary); font-family: monospace; }
        .progress-bar-container { width: 100%; height: 12px; background: #222; border-radius: 6px; overflow: hidden; margin-bottom: 25px; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), #b100ff); width: 0%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* Roulette Screen */
        .roulette-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; }
        .roulette-window { width: 100%; height: 120px; background: #0a0a0f; border: 3px solid var(--primary); border-radius: 15px; position: relative; margin-bottom: 30px; box-shadow: 0 0 30px rgba(0,229,255,0.2); overflow: hidden; }
        .roulette-window::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 30px; background: linear-gradient(to bottom, #0a0a0f 0%, transparent 100%); z-index: 10; pointer-events: none;}
        .roulette-window::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 30px; background: linear-gradient(to top, #0a0a0f 0%, transparent 100%); z-index: 10; pointer-events: none;}
        .roulette-items { display: flex; flex-direction: column; width: 100%; transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1); }
        .r-item { height: 120px; display: flex; align-items: center; justify-content: center; width: 100%; font-size: 22px; font-weight: 900; text-align: center; letter-spacing: 1px; text-shadow: 0 3px 6px rgba(0,0,0,0.9); padding: 0 10px;}
        .selector-line { position: absolute; width: 100%; height: 4px; background: rgba(255,255,255,0.8); top: 50%; margin-top: -2px; z-index: 15; pointer-events: none; box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        
        .exercise-card { background: var(--surface); padding: 20px; border-radius: 12px; margin-bottom: 15px; border-left: 4px solid var(--primary); }
        .ex-reps { font-size: 20px; font-weight: bold; color: var(--primary); margin: 10px 0; }
        .dev-box { border: 1px dashed var(--danger); padding: 15px; border-radius: 8px; margin-top: 20px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        @keyframes floatPulse { 0% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-12px) scale(1.03); } 100% { transform: translateY(0px) scale(1); } }
        @keyframes glitch { 0% { transform: translate(2px, 1px); } 20% { transform: translate(-2px, -1px); } 40% { transform: translate(1px, 2px); } 60% { transform: translate(-1px, -2px); } 80% { transform: translate(2px, -1px); } 100% { transform: translate(-2px, 1px); } }
    </style>
</head>
<body>

<div id="app">
    <!-- ИНИЦИАЛИЗАЦИЯ -->
    <div id="screen-init" class="screen">
        <h1 class="neon-text" style="margin-top: 40px;">ПРОФИЛИРОВАНИЕ</h1>
        <p style="text-align: center; color: #888; margin-bottom: 20px;">Определяем вектор адаптации.</p>
        <p style="text-align: center; color: var(--primary); margin-bottom: 40px; font-size: 12px;">Подтверди Push-уведомления для настройки нейронной связи с сервером.</p>
        <button class="btn" onclick="initProfile('male')">Мужской генотип (Рыцарь)</button>
        <button class="btn" onclick="initProfile('female')">Женский генотип (Принцесса)</button>
    </div>

    <!-- ДАШБОРД -->
    <div id="screen-dashboard" class="screen">
        <div class="speech-bubble" id="avatar-speech">Загрузка нейроинтерфейса...</div>
        
        <div class="avatar-container" id="avatar-wrapper">
            <!-- ВНЕШНЯЯ КАРТИНКА АВАТАРА С ЖЕСТКОЙ МАРШРУТИЗАЦИЕЙ -->
            <img id="avatar-image" class="rpg-avatar-img" src="" alt="Avatar" onerror="this.onerror=null;this.src='https://placehold.co/220x220/1a1a24/ff0055?text=IMAGE+MISSING';">
            <div class="hologram-base"></div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div style="font-size: 11px; color: #888; letter-spacing: 1px;">УРОВЕНЬ</div>
                <div class="stat-value" id="ui-level">1</div>
            </div>
            <div class="stat-card">
                <div style="font-size: 11px; color: #888; letter-spacing: 1px;">СТРИК (ДНЕЙ)</div>
                <div class="stat-value" id="ui-streak">0</div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #888; margin-bottom: 5px;">
            <span>СИНТЕЗ (XP)</span>
            <span id="ui-xp-text">0 / 100</span>
        </div>
        <div class="progress-bar-container"><div class="progress-bar" id="ui-xp-bar"></div></div>

        <button class="btn btn-spin" onclick="openRoulette()">🎰 ДОЗА НА СЕГОДНЯ</button>
        
        <div style="margin-top: auto; padding-top: 15px;">
            <button class="btn" style="border-color: #333; color: #666; padding: 12px;" onclick="showScreen('screen-data')">⚙️ Настройки и DEV TOOLS</button>
        </div>
    </div>

    <!-- РУЛЕТКА -->
    <div id="screen-roulette" class="screen">
        <div class="top-nav">
            <button class="btn-nav" onclick="showScreen('screen-dashboard')">🏠 НА БАЗУ</button>
        </div>
        <div class="roulette-container">
            <h2 class="neon-text" id="roulette-title">РУЛЕТКА СУДЬБЫ</h2>
            <p style="color: #888; margin-bottom: 30px; text-align: center;" id="roulette-desc">Пути назад нет. Жребий брошен.</p>
            
            <div class="roulette-window">
                <div class="selector-line"></div>
                <div class="roulette-items" id="roulette-wheel"></div>
            </div>
            
            <button class="btn btn-spin" id="btn-start-spin" onclick="spinRoulette()">КРУТИТЬ (ACTION LOCK)</button>
            <button class="btn" id="btn-accept-workout" style="display: none;" onclick="startWorkout()">ПРИНЯТЬ ВЫЗОВ</button>
        </div>
    </div>

    <!-- ТРЕНИРОВКА -->
    <div id="screen-workout" class="screen">
        <div class="top-nav">
            <button class="btn-nav" onclick="showScreen('screen-dashboard')">🏠 НА БАЗУ</button>
        </div>
        <h2 class="neon-text" id="workout-title">ФАЗА: ...</h2>
        <p style="text-align: center; color: var(--gold); margin-bottom: 20px;" id="workout-subtitle"></p>
        <div id="workout-content" style="overflow-y: auto; flex: 1;"></div>
        
        <div style="margin-top: 20px;">
            <button class="btn" onclick="finishWorkout()">ЗАВЕРШИТЬ (ЗАБРАТЬ XP)</button>
            <button class="btn btn-danger" onclick="showScreen('screen-dashboard')">СБЕЖАТЬ (ДОЛГ ОСТАНЕТСЯ)</button>
        </div>
    </div>

    <!-- НАСТРОЙКИ И ЧИТЫ -->
    <div id="screen-data" class="screen" style="overflow-y: auto;">
        <div class="top-nav">
            <button class="btn-nav" onclick="showScreen('screen-dashboard')">🏠 НА БАЗУ</button>
        </div>
        <h2>НАСТРОЙКИ</h2>
        
        <button class="btn" style="padding: 12px;" onclick="exportData()">💾 СКАЧАТЬ СОХРАНЕНИЕ</button>
        <div style="margin-bottom: 20px;">
            <input type="file" id="import-file" accept=".json" style="color: white; margin-bottom: 10px; width: 100%;">
            <button class="btn" style="padding: 12px;" onclick="importData()">📂 ЗАГРУЗИТЬ</button>
        </div>

        <div class="dev-box">
            <h3 style="color: var(--danger); font-size: 14px;">DEV TOOLS (ТЕСТИРОВАНИЕ)</h3>
            <button class="btn" style="padding: 10px; font-size: 14px; border-color: var(--danger); color: var(--danger);" onclick="testPushNotification()">🔔 ТЕСТ PUSH-УВЕДОМЛЕНИЯ</button>
            <p id="push-debug" style="color: #888; font-size: 11px; margin-bottom: 10px; text-align: center;"></p>
            <button class="btn" style="padding: 10px; font-size: 14px;" onclick="cheatLevel(1)">+1 УРОВЕНЬ</button>
            <button class="btn" style="padding: 10px; font-size: 14px;" onclick="cheatLevel(-1)">-1 УРОВЕНЬ</button>
            <button class="btn" style="padding: 10px; font-size: 14px; border-color: #888; color: #888;" onclick="resetDaily()">СБРОСИТЬ БРОСОК СЕГОДНЯ</button>
            <button class="btn btn-danger" style="padding: 10px; font-size: 14px; margin-top: 15px;" onclick="resetData()">💀 ОБНУЛИТЬ ВСЕ ДАННЫЕ</button>
        </div>
    </div>
</div>

<script>
    // =======================================================================
    // БРОНЕБОЙНЫЕ ОТНОСИТЕЛЬНЫЕ ПУТИ
    // =======================================================================
    const avatarDB = {
        male: {
            t1: "./Man1.png",
            t2: "./Man2.png",
            t3: "./Man3.png",
            t4: "./Man4.png",
            dead: "./Man5.png"
        },
        female: {
            t1: "https://placehold.co/400x400/1a1a24/ff66b2?text=FEMALE+T1+NOVICE",
            t2: "https://placehold.co/400x400/1a1a24/ff66b2?text=FEMALE+T2+ROGUE",
            t3: "https://placehold.co/400x400/1a1a24/00ffaa?text=FEMALE+T3+PRINCESS",
            t4: "https://placehold.co/400x400/1a1a24/ffd700?text=FEMALE+T4+VALKYRIE",
            dead: "https://placehold.co/400x400/1a1a24/ff0055?text=DEAD+STREAK"
        },
        dead: "https://placehold.co/400x400/1a1a24/ff0055?text=DEAD+STREAK"
    };
    // =======================================================================

    // --- БАЗА ДАННЫХ И СОСТОЯНИЕ ---
    let appData = {
        profile: { gender: null, level: 1, xp: 0, nextXp: 100, lastWorkoutTime: 0 },
        gamification: { streak: 0, dailyRoll: null, pushEnabled: false }
    };

    let currentWorkoutType = null;

    // --- УПРАЖНЕНИЯ ---
    const exerciseDB = {
        upper: {
            male: [{ name: "Жим 1 гантели на полу", tips: "Фокус на грудь." }, { name: "Тяга в наклоне", tips: "Локоть к тазу." }, { name: "Пуловер", tips: "Растягивай широчайшие." }],
            female: [{ name: "Отжимания от стены", tips: "Очень легко, без напряжения спины." }, { name: "Тяга легкой гантели", tips: "Своди лопатки плавно." }, { name: "Растяжка грудных", tips: "Просто потянись в дверном проеме." }]
        },
        lower: {
            male: [{ name: "Гоблет-присед", tips: "Гантель у груди." }, { name: "Выпады", tips: "Баланс." }, { name: "Румынская тяга", tips: "Таз назад." }],
            female: [{ name: "Ягодичный мост (без веса)", tips: "Плавно поднимай таз." }, { name: "Приседания на край стула", tips: "Коснись стула и встань." }, { name: "Махи ногой лежа", tips: "Спокойно, как на пилатесе." }]
        },
        fullbody: {
            male: [{ name: "Рывок", tips: "Мощь от бедер." }, { name: "Трастер", tips: "Одно движение." }, { name: "Отжимания на гантели", tips: "Асимметрия." }],
            female: [{ name: "Планка на коленях", tips: "Держи 20 сек." }, { name: "Легкие свинги", tips: "Покачай гантель тазом." }, { name: "Кошка-Корова", tips: "Расслабь спину." }]
        }
    };

    const rouletteOptions = [
        { id: 'upper', text: "💪 ВЕРХ ТЕЛА", color: "#00e5ff" },
        { id: 'lower', text: "🦵 НИЗ ТЕЛА", color: "#00e5ff" },
        { id: 'fullbody', text: "🔥 ФУЛЛБОДИ", color: "#ff0055" },
        { id: 'rest', text: "🧘 ВОССТАНОВЛЕНИЕ", color: "#00ffaa" }
    ];

    // --- ЛОГИКА ---
    function getTodayStr() {
        const d = new Date();
        return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
    }

    function init() {
        const saved = localStorage.getItem('forgeSaveV7');
        if (saved) {
            appData = JSON.parse(saved);
            if(appData.profile.gender) { 
                updateDashboard(); 
                showScreen('screen-dashboard'); 
                checkPushAlarms();
                return; 
            }
        }
        showScreen('screen-init');
    }

    function initProfile(gender) {
        appData.profile.gender = gender;
        saveData(); 
        
        if ("Notification" in window) {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    appData.gamification.pushEnabled = true;
                    saveData();
                    new Notification("Dopamine Forge", { body: "Связь с ЦНС установлена. Готовься к адаптации." });
                }
            });
        }
        
        updateDashboard(); 
        showScreen('screen-dashboard');
    }

    function updateDashboard() {
        document.getElementById('ui-level').innerText = appData.profile.level;
        document.getElementById('ui-streak').innerText = appData.gamification.streak;
        
        const xpPercent = Math.min((appData.profile.xp / appData.profile.nextXp) * 100, 100);
        document.getElementById('ui-xp-bar').style.width = xpPercent + '%';
        document.getElementById('ui-xp-text').innerText = `${appData.profile.xp} / ${appData.profile.nextXp}`;

        updateAvatar();
    }

    function updateAvatar() {
        const wrapper = document.getElementById('avatar-wrapper');
        const imgElement = document.getElementById('avatar-image');
        const speech = document.getElementById('avatar-speech');
        
        const lvl = appData.profile.level;
        const gender = appData.profile.gender;
        
        wrapper.className = 'avatar-container'; 
        
        const now = new Date().getTime();
        let isDead = false;
        if (appData.profile.lastWorkoutTime !== 0) {
            const hours = (now - appData.profile.lastWorkoutTime) / (1000 * 60 * 60);
            if (hours > 48) isDead = true;
        }

        if (isDead) {
            wrapper.classList.add('tier-dead');
            imgElement.src = avatarDB[gender].dead || avatarDB.dead; 
            speech.innerHTML = "<span style='color:var(--danger)'>Стрик потерян. Визуальный якорь разрушен. Восстановись!</span>";
            appData.gamification.streak = 0;
            return;
        }

        if (lvl < 5) {
            wrapper.classList.add('tier-1');
            imgElement.src = avatarDB[gender].t1;
            speech.innerText = gender === 'male' ? "Форма слабая. Нужен стресс. Крути рулетку." : "Пора разбудить эндорфины. Начнем с легкого.";
        } else if (lvl < 10) {
            wrapper.classList.add('tier-2');
            imgElement.src = avatarDB[gender].t2;
            speech.innerText = gender === 'male' ? "Мышцы уплотняются. Форма приобретает объем." : "Тонус в норме. Твоя мантия готова.";
        } else if (lvl < 20) {
            wrapper.classList.add('tier-3');
            imgElement.src = avatarDB[gender].t3;
            speech.innerText = gender === 'male' ? "Броня крестоносца. Твоя дисциплина становится железом." : "Тиара принцессы. Ты чувствуешь эту грацию?";
        } else {
            wrapper.classList.add('tier-4');
            imgElement.src = avatarDB[gender].t4;
            speech.innerText = gender === 'male' ? "Эпическая аура. Ты машина." : "Крылья Валькирии. Абсолютная доминация.";
        }
    }

    // --- РУЛЕТКА ---
    function openRoulette() {
        showScreen('screen-roulette');
        const wheel = document.getElementById('roulette-wheel');
        const btnStart = document.getElementById('btn-start-spin');
        const btnAccept = document.getElementById('btn-accept-workout');
        
        const today = getTodayStr();
        const roll = appData.gamification.dailyRoll;

        if (roll && roll.date === today) {
            if (roll.completed) {
                wheel.style.transform = 'translateY(0px)';
                wheel.innerHTML = `<div class="r-item" style="color: var(--gold); font-size: 18px;">ДОЗА ПОЛУЧЕНА.<br>ПРИХОДИ ЗАВТРА.</div>`;
                btnStart.style.display = 'none';
                btnAccept.style.display = 'none';
            } else {
                currentWorkoutType = roll.result;
                wheel.style.transition = 'none';
                wheel.style.transform = 'translateY(0px)';
                wheel.innerHTML = `<div class="r-item" style="color: ${currentWorkoutType.color}">${currentWorkoutType.text}</div>`;
                btnStart.style.display = 'none';
                btnAccept.style.display = 'flex';
                btnAccept.innerText = "ПРОДОЛЖИТЬ ВЫЗОВ";
                document.getElementById('roulette-title').innerText = "ВЫЗОВ ЗАФИКСИРОВАН";
                document.getElementById('roulette-desc').innerText = "От судьбы не убежишь. Выполняй.";
            }
            return;
        }

        document.getElementById('roulette-title').innerText = "РУЛЕТКА СУДЬБЫ";
        document.getElementById('roulette-desc').innerText = "Пути назад нет. Жребий брошен.";
        btnStart.style.display = 'block';
        btnAccept.style.display = 'none';
        
        let html = '';
        for(let i=0; i<30; i++) {
            const opt = rouletteOptions[i % rouletteOptions.length];
            html += `<div class="r-item" style="color: ${opt.color}">${opt.text}</div>`;
        }
        wheel.style.transition = 'none';
        wheel.style.transform = 'translateY(0px)';
        wheel.innerHTML = html;
    }

    function spinRoulette() {
        document.getElementById('btn-start-spin').style.display = 'none';
        const wheel = document.getElementById('roulette-wheel');
        
        const winIndex = Math.floor(Math.random() * rouletteOptions.length);
        currentWorkoutType = rouletteOptions[winIndex];
        
        appData.gamification.dailyRoll = { date: getTodayStr(), result: currentWorkoutType, completed: false };
        saveData();

        const itemHeight = 120;
        const stopPosition = (20 * itemHeight) + (winIndex * itemHeight); 
        
        setTimeout(() => {
            wheel.style.transition = 'transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)';
            wheel.style.transform = `translateY(-${stopPosition}px)`;
        }, 50);

        setTimeout(() => {
            const btnAccept = document.getElementById('btn-accept-workout');
            btnAccept.style.display = 'flex';
            btnAccept.innerText = currentWorkoutType.id === 'rest' ? "ЗАБРАТЬ ОТДЫХ И XP" : "НАЧАТЬ ТРЕНИРОВКУ";
        }, 4200);
    }

    function startWorkout() {
        if (currentWorkoutType.id === 'rest') {
            finishWorkout(true);
            return;
        }

        showScreen('screen-workout');
        document.getElementById('workout-title').innerText = currentWorkoutType.text;
        
        const lvl = appData.profile.level;
        const gender = appData.profile.gender;
        const exercises = exerciseDB[currentWorkoutType.id][gender];
        
        let sets = 0, reps = "", note = "";
        
        if (gender === 'female') {
            sets = 2; reps = "8-10"; 
            note = "Эндорфиновый тонус: Никакого отказа. Легкость и грация.";
        } else {
            if (lvl < 5) {
                sets = 2; reps = "8-10"; note = "Режим: Втягивание. Не в отказ.";
            } else if (lvl < 15) {
                sets = 3; reps = "10-12"; note = "Режим: Гипертрофия. Оставь 1 повтор в запасе.";
            } else {
                sets = 4; reps = "12-15 + Дропсет"; note = "Режим: Машина. До жесткого отказа.";
            }
        }
        
        document.getElementById('workout-subtitle').innerText = note;

        let html = '';
        exercises.forEach((ex, idx) => {
            html += `
                <div class="exercise-card">
                    <h3>${idx + 1}. ${ex.name}</h3>
                    <div class="ex-reps">${sets} подх. x ${reps}</div>
                    <p style="margin-top: 10px; font-size: 13px; border-top: 1px solid #333; padding-top: 10px;">💡 ${ex.tips}</p>
                </div>
            `;
        });
        document.getElementById('workout-content').innerHTML = html;
    }

    function finishWorkout(isRest = false) {
        let gain = isRest ? 20 : 50 + (appData.profile.level * 2); 
        appData.profile.xp += gain;
        appData.profile.lastWorkoutTime = new Date().getTime();
        appData.gamification.streak += 1;
        
        appData.gamification.dailyRoll.completed = true;

        if (appData.profile.xp >= appData.profile.nextXp) {
            appData.profile.level += 1;
            appData.profile.xp -= appData.profile.nextXp;
            appData.profile.nextXp = Math.floor(appData.profile.nextXp * 1.3);
            alert(`🔥 ЭВОЛЮЦИЯ! НОВЫЙ УРОВЕНЬ: ${appData.profile.level}. Аватар обновлен.`);
        }

        saveData(); updateDashboard(); showScreen('screen-dashboard');
    }

    // --- PUSH NOTIFICATIONS TESTING ---
    function testPushNotification() {
        const debugText = document.getElementById('push-debug');
        
        if (window.location.protocol === 'file:') {
            debugText.innerText = "ОШИБКА: Протокол file:// блокирует пуши. Загрузи файл на GitHub Pages по инструкции выше.";
            return;
        }

        if (!("Notification" in window)) {
            debugText.innerText = "ОШИБКА: Браузер не поддерживает Push API.";
        } else if (Notification.permission === "granted") {
            new Notification("Dopamine Forge", { 
                body: "Тестовый выброс кортизола. Твои мышцы ждут загрузки.",
                icon: "⚡"
            });
            debugText.innerText = "Пуш отправлен! Если не видишь - проверь 'Фокусировку внимания' в Windows/Телефоне.";
        } else if (Notification.permission === "denied") {
            debugText.innerText = "ОШИБКА: Уведомления жестко заблокированы браузером. Разреши их вручную.";
        } else {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    new Notification("Dopamine Forge", { body: "Разрешение получено." });
                    debugText.innerText = "Разрешение получено.";
                }
            });
        }
    }

    function checkPushAlarms() {
        if (appData.gamification.pushEnabled && appData.profile.lastWorkoutTime !== 0 && Notification.permission === "granted") {
            const now = new Date().getTime();
            const hours = (now - appData.profile.lastWorkoutTime) / (1000 * 60 * 60);
            
            if (hours > 24 && hours < 48 && (!appData.gamification.dailyRoll || appData.gamification.dailyRoll.date !== getTodayStr())) {
                setTimeout(() => {
                    new Notification("Dopamine Forge", { body: "Уровень дофамина падает. Зайди и покрути рулетку." });
                }, 3000);
            }
        }
    }

    // --- DEV TOOLS ---
    function cheatLevel(mod) { appData.profile.level = Math.max(1, appData.profile.level + mod); saveData(); updateDashboard(); }
    function resetDaily() { appData.gamification.dailyRoll = null; saveData(); alert("Бросок рулетки на сегодня сброшен."); }
    function resetData() { if(confirm("Удалить ДНК и прогресс?")) { localStorage.removeItem('forgeSaveV7'); location.reload(); } }
    function saveData() { localStorage.setItem('forgeSaveV7', JSON.stringify(appData)); }
    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
        const a = document.createElement('a'); a.href = dataStr; a.download = "forge_backup_v7.json";
        document.body.appendChild(a); a.click(); a.remove();
    }
    function importData() {
        const file = document.getElementById('import-file').files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try { appData = JSON.parse(e.target.result); saveData(); updateDashboard(); showScreen('screen-dashboard'); } 
            catch { alert("Ошибка файла."); }
        };
        reader.readAsText(file);
    }
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('push-debug').innerText = ""; 
    }

    window.onload = init;
</script>
</body>
</html>
